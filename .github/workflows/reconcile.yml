name: reconcile
# Manual and safe: records posts that are already on Instagram as published. Never posts anything.
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Reconcile
        env:
          IG_PAGE_A_USER_ID: ${{ secrets.IG_PAGE_A_USER_ID }}
          IG_PAGE_A_TOKEN: ${{ secrets.IG_PAGE_A_TOKEN }}
          IG_PAGE_B_USER_ID: ${{ secrets.IG_PAGE_B_USER_ID }}
          IG_PAGE_B_TOKEN: ${{ secrets.IG_PAGE_B_TOKEN }}
        run: python pipeline/publish.py --live --reconcile
      - name: Commit
        run: |
          git config user.name "reconcile"
          git config user.email "reconcile@users.noreply.github.com"
          git add content/posts
          git diff --cached --quiet && exit 0
          git commit -m "reconcile: record posts already on Instagram [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
