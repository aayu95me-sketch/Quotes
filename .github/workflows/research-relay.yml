name: research-relay
# Triggered by pushing a request file on a claude/** branch. Results are committed back to the same branch.
on:
  push:
    branches: ["claude/**"]
    paths: ["research/requests/**"]
permissions:
  contents: write
concurrency:
  group: research-relay-${{ github.ref }}
  cancel-in-progress: false
jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Process requests
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python pipeline/relay.py
      - name: Commit answers
        run: |
          git config user.name "research-relay"
          git config user.email "research-relay@users.noreply.github.com"
          git add research/answers
          git diff --cached --quiet && exit 0
          git commit -m "research-relay: add answers [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
