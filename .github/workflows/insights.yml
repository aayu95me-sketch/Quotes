name: insights
# Daily: pull Instagram insights for published posts and commit a plain-language report to research/insights/.
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: insights
  cancel-in-progress: false
jobs:
  insights:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pull insights
        env:
          IG_PAGE_A_USER_ID: ${{ secrets.IG_PAGE_A_USER_ID }}
          IG_PAGE_A_TOKEN: ${{ secrets.IG_PAGE_A_TOKEN }}
          IG_PAGE_B_USER_ID: ${{ secrets.IG_PAGE_B_USER_ID }}
          IG_PAGE_B_TOKEN: ${{ secrets.IG_PAGE_B_TOKEN }}
        run: python pipeline/insights.py
      - name: Commit report
        run: |
          git config user.name "insights"
          git config user.email "insights@users.noreply.github.com"
          git add research/insights
          git diff --cached --quiet && exit 0
          git commit -m "insights: daily report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
