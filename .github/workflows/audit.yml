name: audit
# Manual: read-only comparison of the repo's idea of published posts with what Instagram and Facebook actually show.
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Audit
        env:
          IG_PAGE_A_USER_ID: ${{ secrets.IG_PAGE_A_USER_ID }}
          IG_PAGE_A_TOKEN: ${{ secrets.IG_PAGE_A_TOKEN }}
          IG_PAGE_B_USER_ID: ${{ secrets.IG_PAGE_B_USER_ID }}
          IG_PAGE_B_TOKEN: ${{ secrets.IG_PAGE_B_TOKEN }}
        run: python pipeline/audit.py
      - name: Commit report
        run: |
          git config user.name "audit"
          git config user.email "audit@users.noreply.github.com"
          git add research/audit
          git diff --cached --quiet && exit 0
          git commit -m "audit report [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
