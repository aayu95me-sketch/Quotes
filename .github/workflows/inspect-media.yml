name: inspect-media
on:
  workflow_dispatch:
    inputs:
      media:
        description: "page_a:<id> page_b:<id> ..."
        required: true
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: ffmpeg (static binary via pip, no apt)
        timeout-minutes: 5
        run: |
          pip install -q imageio-ffmpeg
          sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Inspect
        env:
          IG_PAGE_A_TOKEN: ${{ secrets.IG_PAGE_A_TOKEN }}
          IG_PAGE_B_TOKEN: ${{ secrets.IG_PAGE_B_TOKEN }}
        run: python pipeline/inspect_media.py ${{ github.event.inputs.media }}
