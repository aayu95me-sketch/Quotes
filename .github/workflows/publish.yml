name: publish
# Scheduled workflows only run from the DEFAULT branch, so this activates once the work is merged to main.
# Safety rail: it posts for real only if the repo VARIABLE LIVE_PUBLISH is set to "true". Otherwise it is a dry run.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Anything due? (cheap check, keeps Actions minutes low)
        id: due
        run: |
          echo "n=$(python pipeline/publish.py --count | tail -1)" >> "$GITHUB_OUTPUT"
          echo "fb=$(python pipeline/publish.py --fb-pending | tail -1)" >> "$GITHUB_OUTPUT"
      - name: Install renderer
        if: steps.due.outputs.n != '0'
        timeout-minutes: 8
        run: |
          # packages.microsoft.com returns 403 on runners and breaks apt-get update; we do not need it
          sudo rm -f /etc/apt/sources.list.d/microsoft-prod.list /etc/apt/sources.list.d/microsoft-prod.sources /etc/apt/sources.list.d/*microsoft* 2>/dev/null || true
          pip install playwright
          playwright install --with-deps chromium
      - name: Install ffmpeg (static binary via pip, no apt)
        if: steps.due.outputs.n != '0'
        timeout-minutes: 5
        run: |
          pip install -q imageio-ffmpeg
          sudo ln -sf "$(python -c 'import imageio_ffmpeg;print(imageio_ffmpeg.get_ffmpeg_exe())')" /usr/local/bin/ffmpeg
          ffmpeg -version | head -1
      - name: Publish due, approved posts (and mirror to Facebook)
        if: steps.due.outputs.n != '0' || steps.due.outputs.fb != '0'
        env:
          LIVE: ${{ vars.LIVE_PUBLISH }}
          ASSETS_REPO: ${{ vars.ASSETS_REPO }}
          ASSETS_PAT: ${{ secrets.ASSETS_PAT }}
          IG_PAGE_A_USER_ID: ${{ secrets.IG_PAGE_A_USER_ID }}
          IG_PAGE_A_TOKEN: ${{ secrets.IG_PAGE_A_TOKEN }}
          IG_PAGE_B_USER_ID: ${{ secrets.IG_PAGE_B_USER_ID }}
          IG_PAGE_B_TOKEN: ${{ secrets.IG_PAGE_B_TOKEN }}
        run: |
          if [ "$LIVE" = "true" ]; then python pipeline/publish.py --live; else python pipeline/publish.py; fi
      - name: Commit post status changes
        if: always()
        run: |
          git config user.name "publisher"
          git config user.email "publisher@users.noreply.github.com"
          git add content/posts
          git diff --cached --quiet && exit 0
          git commit -m "publisher: update post status [skip ci]"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
      - name: Health check (fails, so GitHub emails the owner, if posts are late or the approved runway is short)
        if: always()
        run: python pipeline/publish.py --health
